<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="wineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4e1126"/>
      <stop offset="50%" stop-color="#3E0D1E"/>
      <stop offset="100%" stop-color="#2a0713"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD269"/>
      <stop offset="100%" stop-color="#EDB23A"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background rounded squircle matching the logo -->
  <rect width="512" height="512" rx="100" fill="url(#wineGrad)"/>

  <!-- Subtle border around icon -->
  <rect x="8" y="8" width="496" height="496" rx="92" fill="none" stroke="#EDB23A" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Floating Inventory & Stock elements -->
  <!-- Top Left Box -->
  <g stroke="#EDB23A" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M80 80 L135 55 L190 80 L135 105 Z" fill="#EDB23A" fill-opacity="0.15"/>
    <path d="M80 80 L80 135 L135 160 L135 105 Z" fill="#EDB23A" fill-opacity="0.1"/>
    <path d="M135 160 L190 135 L190 80"/>
    <line x1="135" y1="105" x2="135" y2="160"/>
  </g>

  <!-- Growth Chart Arrow -->
  <g stroke="#EDB23A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M120 190 L165 145 L200 165 L240 100" fill="none"/>
    <polyline points="215,100 240,100 240,125" fill="none"/>
    <!-- Chart Bars -->
    <rect x="135" y="180" width="12" height="30" fill="#EDB23A" rx="3"/>
    <rect x="160" y="155" width="12" height="55" fill="#EDB23A" rx="3"/>
    <rect x="185" y="170" width="12" height="40" fill="#EDB23A" rx="3"/>
    <rect x="210" y="125" width="12" height="85" fill="#EDB23A" rx="3"/>
  </g>

  <!-- Top Right Stacked Boxes & Cart -->
  <g stroke="#EDB23A" stroke-width="3.5" fill="#EDB23A" fill-opacity="0.12">
    <rect x="310" y="80" width="35" height="30" rx="4"/>
    <rect x="345" y="80" width="35" height="30" rx="4"/>
    <rect x="328" y="50" width="35" height="30" rx="4"/>
    <!-- Shopping Cart -->
    <path d="M395 70 L405 70 L420 100 L445 100 L452 78 L410 78" fill="none" stroke="#EDB23A" stroke-width="3"/>
    <circle cx="423" cy="108" r="4" fill="#EDB23A"/>
    <circle cx="442" cy="108" r="4" fill="#EDB23A"/>
  </g>

  <!-- Left Cog/Gear -->
  <g transform="translate(65, 145)" stroke="#EDB23A" stroke-width="3" fill="none">
    <circle cx="20" cy="20" r="12" fill="#3E0D1E"/>
    <circle cx="20" cy="20" r="5" fill="#EDB23A"/>
    <path d="M20 4 L20 8 M20 32 L20 36 M4 20 L8 20 M32 20 L36 20 M9 9 L12 12 M28 28 L31 31 M9 31 L12 28 M28 12 L31 9" stroke-linecap="round"/>
  </g>

  <!-- Right Barcode & Checkmark -->
  <g transform="translate(400, 195)" stroke="#EDB23A">
    <line x1="0" y1="0" x2="0" y2="35" stroke-width="4"/>
    <line x1="8" y1="0" x2="8" y2="35" stroke-width="2"/>
    <line x1="15" y1="0" x2="15" y2="35" stroke-width="5"/>
    <line x1="24" y1="0" x2="24" y2="35" stroke-width="2"/>
    <line x1="32" y1="0" x2="32" y2="35" stroke-width="4"/>
  </g>
  <g transform="translate(370, 260)" stroke="#7BC67E" stroke-width="4" fill="none" stroke-linecap="round">
    <circle cx="18" cy="18" r="16" fill="#57182A" stroke="#EDB23A" stroke-width="2.5"/>
    <polyline points="10,18 16,24 26,12"/>
  </g>

  <!-- Bottom Right Warehouse Box -->
  <g transform="translate(350, 310)" stroke="#EDB23A" stroke-width="3.5" fill="#57182A">
    <path d="M0 30 L45 10 L90 30 L45 50 Z" fill="#EDB23A" fill-opacity="0.2"/>
    <path d="M0 30 L0 75 L45 95 L45 50 Z"/>
    <path d="M45 95 L90 75 L90 30"/>
    <line x1="45" y1="50" x2="45" y2="95"/>
    <path d="M35 25 L45 20 L55 25 L45 30 Z" fill="#EDB23A"/>
  </g>

  <!-- THE POWERFUL BULL (Central Silhouette with Golden Contours) -->
  <g filter="url(#shadow)">
    <!-- Bull Body Base fill -->
    <path d="M125 365 
             C120 310 135 250 160 215 
             C185 180 235 155 280 145
             C300 140 330 145 345 155
             C375 175 405 220 395 260
             C390 280 370 295 355 305
             C330 320 310 325 295 345
             C275 370 260 375 235 375
             C200 375 160 380 125 365 Z"
          fill="#4a1023"/>

    <!-- Bull Horns (Majestic Curved Gold) -->
    <path d="M285 145 
             C275 95 240 60 190 70 
             C225 80 250 105 260 135 Z"
          fill="url(#goldGrad)" stroke="#EDB23A" stroke-width="3"/>
    <path d="M340 145 
             C360 85 410 50 460 70 
             C425 80 385 105 365 140 Z"
          fill="url(#goldGrad)" stroke="#EDB23A" stroke-width="3"/>

    <!-- Bull Head & Snout -->
    <path d="M300 150 
             C325 150 360 165 375 190
             C385 205 385 225 375 245
             C365 260 345 270 325 265
             C305 260 290 240 290 215
             C290 185 295 160 300 150 Z" 
          fill="#5B1B2D" stroke="#EDB23A" stroke-width="4.5"/>

    <!-- Snout & Nostrils -->
    <ellipse cx="345" cy="245" rx="20" ry="14" fill="#F0DCAF" stroke="#EDB23A" stroke-width="2"/>
    <circle cx="338" cy="246" r="3.5" fill="#3E0D1E"/>
    <circle cx="352" cy="246" r="3.5" fill="#3E0D1E"/>

    <!-- Fierce Eye -->
    <path d="M325 195 Q340 185 352 195 Q338 202 325 195 Z" fill="#F0DCAF"/>
    <polygon points="332,192 342,192 340,198" fill="#3E0D1E"/>
    <path d="M322 188 L355 186" stroke="#EDB23A" stroke-width="3" stroke-linecap="round"/>

    <!-- Bull Muscular Anatomy Lines (Golden Neon Vector Style) -->
    <!-- Shoulder & Hump -->
    <path d="M260 145 C280 135 305 135 315 148" fill="none" stroke="#EDB23A" stroke-width="6" stroke-linecap="round"/>
    <path d="M245 160 C265 175 275 205 275 235" fill="none" stroke="#EDB23A" stroke-width="5" stroke-linecap="round"/>
    <!-- Spine and Ribs -->
    <path d="M165 225 C190 190 230 165 265 165" fill="none" stroke="#EDB23A" stroke-width="5" stroke-linecap="round"/>
    <path d="M195 245 C215 225 240 215 265 220" fill="none" stroke="#EDB23A" stroke-width="4" stroke-linecap="round"/>
    <path d="M175 275 C205 255 235 250 260 255" fill="none" stroke="#EDB23A" stroke-width="4" stroke-linecap="round"/>

    <!-- Forelegs (Tense Athletic Stance) -->
    <!-- Front Left Leg -->
    <path d="M295 270 L305 320 L290 355 L295 385" fill="none" stroke="#EDB23A" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Front Right Leg (Forward) -->
    <path d="M335 270 L350 310 L330 345 L320 375" fill="none" stroke="#EDB23A" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Hooves -->
    <rect x="288" y="385" width="16" height="12" rx="2" fill="#F0DCAF" stroke="#EDB23A" stroke-width="2"/>
    <rect x="312" y="375" width="16" height="12" rx="2" fill="#F0DCAF" stroke="#EDB23A" stroke-width="2"/>

    <!-- Hind Legs -->
    <!-- Back Left Leg -->
    <path d="M150 255 C140 280 140 320 145 385" fill="none" stroke="#EDB23A" stroke-width="5.5" stroke-linecap="round"/>
    <!-- Back Right Leg -->
    <path d="M185 270 C180 300 190 335 195 375" fill="none" stroke="#EDB23A" stroke-width="5.5" stroke-linecap="round"/>
    <!-- Hooves -->
    <rect x="138" y="385" width="16" height="12" rx="2" fill="#F0DCAF" stroke="#EDB23A" stroke-width="2"/>
    <rect x="188" y="375" width="16" height="12" rx="2" fill="#F0DCAF" stroke="#EDB23A" stroke-width="2"/>

    <!-- Tail (Curling Upwards with Tufts) -->
    <path d="M140 235 C110 245 90 270 95 305 C98 320 105 325 115 320" fill="none" stroke="#EDB23A" stroke-width="4" stroke-linecap="round"/>
    <path d="M115 320 C125 315 130 325 125 335 C118 345 105 340 105 330" fill="url(#goldGrad)"/>

    <!-- Ground Line -->
    <line x1="80" y1="400" x2="430" y2="400" stroke="#EDB23A" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- TYPOGRAPHY: BullStock (Bold, Clean, Exact Match) -->
  <g transform="translate(48, 475)">
    <text font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="64" letter-spacing="-1">
      <tspan fill="#EDB23A">Bull</tspan><tspan fill="#FFFFFF">Stock</tspan>
    </text>
  </g>
</svg>
